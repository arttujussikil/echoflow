version: "3.9"

services:
  web:
    build: .
    container_name: echoflow-web
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: echoflow-db
    environment:
      POSTGRES_USER: ${DB_USER:-echoflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-echoflow}
      POSTGRES_DB: ${DB_NAME:-echoflow}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: echoflow-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data: