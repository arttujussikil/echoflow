services:
  web:
    build: .
    container_name: echoflow-web
    env_file:
      - .env
    volumes:
      # Offline sentiment model (~280 MB), downloaded once on first start
      - models_cache:/app/models-cache
    ports:
      - "3000:3000"
    depends_on:
      - db
      - ollama
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: echoflow-db
    environment:
      POSTGRES_USER: ${DB_USER:-echoflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-echoflow}
      POSTGRES_DB: ${DB_NAME:-echoflow}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: echoflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: echoflow-adminer
    ports:
      - "8888:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
  models_cache:
